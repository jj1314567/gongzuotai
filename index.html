<!DOCTYPE html>
<html lang="zh-CN" data-theme="purple">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>嘎的工作台 · 我的专属成长空间</title>
  <meta name="theme-color" content="#7c5cff" />
  <meta name="description" content="嘎的专属成长空间：习惯打卡、体态跟练、私人茶饮管家、爆款灵感" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="嘎的工作台" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部问候条 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">✿</span>
      <div>
        <div class="brand-title">嘎的工作台</div>
        <div class="brand-sub" id="greeting">早安，今天也要好好爱自己</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeQuickBtn" data-action="theme-quick" title="快速切换皮肤">🎨</button>
      <div class="date-chip" id="todayChip">—</div>
    </div>
  </header>

  <div class="layout">
    <!-- 侧边导航 -->
    <aside class="sidebar">
      <nav class="nav">
        <a class="nav-item active" data-view="overview"><span class="nav-ico">🏡</span><span>概览</span></a>
        <a class="nav-item" data-view="health"><span class="nav-ico">🌿</span><span>养生打卡</span></a>
        <a class="nav-item" data-view="posture"><span class="nav-ico">💪</span><span>体态锻炼</span></a>
        <a class="nav-item" data-view="recipe"><span class="nav-ico">🍲</span><span>食谱方子</span></a>
        <a class="nav-item" data-view="diary"><span class="nav-ico">📝</span><span>我的日记</span></a>
        <a class="nav-item" data-view="viral"><span class="nav-ico">🔥</span><span>爆款灵感</span></a>
      <a class="nav-item" data-view="french"><span class="nav-ico">🥐</span><span>法语学习</span></a>
      <a class="nav-item" data-view="tea"><span class="nav-ico">🍵</span><span>茶饮管家</span></a>
      <a class="nav-item" data-view="calendar"><span class="nav-ico">📅</span><span>日历</span></a>
        <a class="nav-item" data-view="settings"><span class="nav-ico">⚙️</span><span>设置</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="mini-stat" id="miniStatDay">今日完成 0 项</div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="content" id="content"><!-- 由 app.js 渲染 --></main>
  </div>

  <!-- 通用弹层 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal" id="modal">
      <div class="modal-head">
        <h3 id="modalTitle">标题</h3>
        <button class="icon-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/viral.js"></script>
  <script src="js/french.js"></script>
  <script src="js/tea.js"></script>
  <script src="js/app.js"></script>
  <script>
    // PWA：仅在 http(s) 下注册 Service Worker（file:// 直接打开时不注册）
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
