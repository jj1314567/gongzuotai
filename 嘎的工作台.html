/* ---------- 基础 ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 12% -8%, var(--bg-2), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, var(--primary-soft), transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment: fixed;
  min-height: 100vh;
  transition: background .5s ease, color .3s ease;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 26px;
  backdrop-filter: blur(14px);
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 40px; height: 40px; display: grid; place-items: center;
  border-radius: 14px; background: var(--grad); color: #fff; font-size: 20px;
  box-shadow: var(--shadow);
}
.brand-title { font-weight: 800; font-size: 17px; letter-spacing: .5px; }
.brand-sub { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.icon-btn {
  border: 1px solid var(--border); background: var(--card-solid);
  width: 38px; height: 38px; border-radius: 12px; font-size: 17px;
  display: grid; place-items: center; color: var(--text);
  transition: transform .15s ease, box-shadow .2s ease;
}
.icon-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.date-chip {
  background: var(--grad); color: #fff; font-weight: 700; font-size: 13px;
  padding: 9px 16px; border-radius: 999px; box-shadow: var(--shadow);
}

/* ---------- 布局 ---------- */
.layout { display: grid; grid-template-columns: 232px 1fr; min-height: calc(100vh - 68px); }
.sidebar {
  padding: 18px 14px; display: flex; flex-direction: column; justify-content: space-between;
  border-right: 1px solid var(--border);
  background: var(--card);
}
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 14px; color: var(--text-soft);
  font-size: 14.5px; font-weight: 600; text-decoration: none;
  transition: all .18s ease;
}
.nav-item .nav-ico { font-size: 17px; }
.nav-item:hover { background: var(--primary-soft); color: var(--text); }
.nav-item.active {
  background: var(--grad); color: #fff; box-shadow: var(--shadow);
}
.sidebar-foot { padding: 10px; }
.mini-stat {
  font-size: 12.5px; color: var(--text-soft); text-align: center;
  background: var(--primary-soft); border-radius: 12px; padding: 10px;
}

.content { padding: 26px 30px 60px; max-width: 1180px; }

/* ---------- 通用卡片/标题 ---------- */
.view-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; gap: 16px; }
.view-title { font-size: 24px; font-weight: 800; }
.view-desc { color: var(--text-soft); font-size: 13.5px; margin-top: 4px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  padding: 20px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
}
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
@media (max-width: 920px) {
  /* 移动端：侧边栏变底部导航栏 */
  .layout { grid-template-columns: 1fr; min-height: auto; }
  .sidebar {
    position: fixed;
    left: 0; right: 0; bottom: 0; top: auto;
    width: 100%;
    flex-direction: row;
    gap: 4px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    border-radius: 0;
    border: none;
    border-top: 1px solid var(--border);
    background: var(--card-solid);
    box-shadow: 0 -10px 30px -12px rgba(0,0,0,.28);
    z-index: 40;
  }
  .nav { flex-direction: row; gap: 2px; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .nav-item {
    flex: 1 0 auto;
    flex-direction: column;
    gap: 2px;
    padding: 6px 8px;
    border-radius: 14px;
    min-width: 54px;
    font-size: 11px;
    justify-content: center;
  }
  .nav-item .nav-ico { font-size: 20px; }
  .nav-item span:last-child { font-size: 11px; }
  .sidebar-foot { display: none; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .content { padding: 18px 16px calc(94px + env(safe-area-inset-bottom, 0px)); max-width: 100%; }
  .view-head { flex-wrap: wrap; gap: 10px; }
  .topbar { padding: 14px 16px; }
  .topbar .brand-sub { display: none; }
}
@media (max-width: 560px) {
  .topbar .brand-title { font-size: 16px; }
  .hero-banner .hero-num { font-size: 40px; }
  .hero-banner .hero-illust { font-size: 46px; }
  .view-title { font-size: 20px; }
  .checkin-card .actions .btn { padding: 4px 7px; }
}

/* ---------- 按钮 ---------- */
.btn {
  border: none; border-radius: 12px; padding: 10px 16px; font-size: 13.5px; font-weight: 700;
  background: var(--grad); color: #fff; box-shadow: var(--shadow);
  transition: transform .15s ease, filter .2s ease;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
.btn.ghost { background: var(--card-solid); color: var(--primary-deep); border: 1px solid var(--border); box-shadow: none; }
.btn.ghost:hover { background: var(--primary-soft); }
.btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
.btn.danger { background: #fff; color: #e11d48; border: 1px solid #fecdd3; box-shadow: none; }
.btn.danger:hover { background: #fff1f3; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
  padding: 5px 11px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-deep);
}

/* ---------- 表单 ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 700; color: var(--text); }
.input, .textarea, select.input {
  width: 100%; border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 13px; font-size: 14px; color: var(--text); background: var(--card-solid);
  transition: border .2s ease, box-shadow .2s ease;
}
.input:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }

/* ---------- 弹层 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(30, 20, 50, .35); backdrop-filter: blur(4px);
  display: grid; place-items: center; z-index: 50; padding: 20px;
}
.modal {
  width: min(680px, 96vw); max-height: 88vh; overflow: auto;
  background: var(--card-solid); border-radius: 22px; border: 1px solid var(--border);
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.4); animation: pop .25s ease;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card-solid); }
.modal-head h3 { font-size: 17px; }
.modal-body { padding: 22px; }

/* ---------- 轻提示 ---------- */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 12px 22px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; z-index: 60; box-shadow: 0 12px 30px -8px rgba(0,0,0,.4);
  animation: toastIn .3s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- 概览 ---------- */
.ov-hero { background: var(--grad); color: #fff; border-radius: 22px; padding: 26px; box-shadow: var(--shadow); }
.ov-hero h2 { font-size: 22px; margin-bottom: 6px; }
.ov-hero p { opacity: .92; font-size: 14px; }
.ov-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
.ov-stat { background: rgba(255,255,255,.18); border-radius: 16px; padding: 14px; }
.ov-stat .n { font-size: 26px; font-weight: 800; }
.ov-stat .l { font-size: 12.5px; opacity: .9; margin-top: 2px; }
@media (max-width: 720px){ .ov-stats { grid-template-columns: repeat(2,1fr);} }
.ov-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 18px; }
@media (max-width: 920px){ .ov-grid { grid-template-columns: 1fr; } }
.quick-link { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; background: var(--card-solid); border: 1px solid var(--border); text-decoration: none; color: var(--text); transition: all .18s ease; }
.quick-link:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.quick-link .ql-ico { font-size: 20px; }
.quick-link .ql-title { font-weight: 700; font-size: 14px; }
.quick-link .ql-sub { font-size: 12px; color: var(--text-soft); }

/* ---------- 打卡清单 ---------- */
.habit {
  display: flex; align-items: center; gap: 14px; padding: 14px;
  background: var(--card-solid); border: 1px solid var(--border); border-radius: 16px;
  transition: all .18s ease;
}
.habit:hover { box-shadow: var(--shadow); }
.habit.done { background: var(--primary-soft); border-color: transparent; }
.check {
  width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--primary);
  display: grid; place-items: center; flex: none; background: #fff; color: #fff;
  transition: all .15s ease; font-weight: 800;
}
.check.on { background: var(--primary); }
.habit-main { flex: 1; min-width: 0; }
.habit-name { font-weight: 700; font-size: 15px; }
.habit-name.done { text-decoration: line-through; color: var(--text-soft); }
.habit-meta { font-size: 12px; color: var(--text-soft); margin-top: 3px; }
.habit-actions { display: flex; gap: 8px; align-items: center; }
.jump-btn {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700;
  padding: 7px 12px; border-radius: 10px; background: var(--primary-soft); color: var(--primary-deep);
  text-decoration: none; border: 1px solid var(--border); transition: all .15s ease;
}
.jump-btn:hover { background: var(--primary); color: #fff; }
.jump-btn.empty { opacity: .55; }

/* ---------- 分类标签 ---------- */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.tab {
  border: 1px solid var(--border); background: var(--card-solid); color: var(--text-soft);
  padding: 8px 15px; border-radius: 999px; font-size: 13px; font-weight: 700;
  transition: all .15s ease;
}
.tab.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: var(--shadow); }
.cat-pill { display: inline-flex; align-items: center; gap: 6px; }
.cat-pill .del { cursor: pointer; color: var(--text-soft); }

/* ---------- 食谱卡 ---------- */
.recipe-card { display: flex; flex-direction: column; gap: 10px; }
.recipe-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-deep); font-weight: 700; }
.tip-box { background: linear-gradient(135deg, var(--primary-soft), transparent); border-left: 3px solid var(--primary); border-radius: 12px; padding: 11px 13px; font-size: 13px; color: var(--text); line-height: 1.6; }
.tip-box b { color: var(--primary-deep); }
.ingredients li, .steps li { font-size: 13.5px; line-height: 1.7; margin-left: 18px; }
.ingredients li { list-style: '🥄'; padding-left: 6px; }
.steps li { list-style: decimal; }

/* ---------- 日记 ---------- */
.diary-editor { display: grid; gap: 12px; }
.diary-list { display: flex; flex-direction: column; gap: 12px; }
.diary-item { background: var(--card-solid); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
.diary-date { font-size: 12.5px; color: var(--text-soft); font-weight: 700; }
.diary-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.diary-body { font-size: 14px; line-height: 1.75; white-space: pre-wrap; color: var(--text); }
.analysis { background: var(--primary-soft); border-radius: 16px; padding: 18px; }
.analysis h4 { font-size: 15px; margin-bottom: 10px; }
.analysis ul { margin-left: 18px; font-size: 13.5px; line-height: 1.8; }
.kpi-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.kpi { background: var(--card-solid); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; flex: 1; min-width: 120px; }
.kpi .n { font-size: 20px; font-weight: 800; color: var(--primary-deep); }
.kpi .l { font-size: 12px; color: var(--text-soft); }

/* ---------- 爆款灵感 ---------- */
.viral-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.viral-card { background: var(--card-solid); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.viral-top { padding: 16px 18px; background: var(--grad); color: #fff; }
.viral-top .vt-platform { font-size: 11.5px; font-weight: 800; opacity: .9; }
.viral-top .vt-title { font-size: 16px; font-weight: 800; margin-top: 4px; line-height: 1.4; }
.viral-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.viral-sec { border-top: 1px dashed var(--border); padding-top: 10px; }
.viral-sec h5 { font-size: 12.5px; color: var(--primary-deep); margin-bottom: 6px; letter-spacing: .3px; }
.viral-sec .line { font-size: 13px; line-height: 1.65; color: var(--text); }
.timeline { display: flex; flex-direction: column; gap: 4px; }
.timeline .tl { display: flex; gap: 8px; font-size: 12.5px; }
.timeline .tl .t { color: var(--primary-deep); font-weight: 800; flex: none; width: 46px; }
.timeline .tl .k { font-weight: 700; }
.gold { color: var(--primary-deep); font-weight: 700; background: var(--primary-soft); padding: 0 4px; border-radius: 5px; }
.emo { color: var(--accent); font-weight: 700; }

/* ---------- 法语 ---------- */
.fr-level { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.fr-lesson { display: flex; align-items: center; gap: 12px; padding: 13px; background: var(--card-solid); border: 1px solid var(--border); border-radius: 14px; }
.fr-lesson .lv { font-size: 12px; font-weight: 800; color: #fff; background: var(--primary); padding: 3px 9px; border-radius: 999px; }
.fr-video { display: flex; align-items: center; gap: 12px; padding: 13px; background: var(--card-solid); border: 1px solid var(--border); border-radius: 14px; }
.fr-video.done { border-color: var(--primary); background: var(--primary-soft); }
.fr-video-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.tag-ok { font-size: 11px; font-weight: 800; color: #fff; background: #16a34a; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
.task-list { display: flex; flex-direction: column; gap: 10px; }
.task { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--card-solid); }
.task .tk { font-size: 18px; }
.quiz { background: var(--primary-soft); border-radius: 16px; padding: 18px; }
.quiz .q { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
.quiz-opt { display: block; width: 100%; text-align: left; padding: 11px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--card-solid); margin-bottom: 8px; font-size: 14px; transition: all .15s ease; }
.quiz-opt:hover { border-color: var(--primary); }
.quiz-opt.correct { background: #d1fae5; border-color: var(--good); }
.quiz-opt.wrong { background: #fee2e2; border-color: #f87171; }
.dur-pick { display: flex; gap: 8px; }
.dur-pick .tab { cursor: pointer; }

/* ---------- 日历 ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.cal-dow { text-align: center; font-size: 12px; font-weight: 800; color: var(--text-soft); padding: 4px 0; }
.cal-cell {
  min-height: 92px; border: 1px solid var(--border); border-radius: 14px; padding: 8px;
  background: var(--card-solid); cursor: pointer; transition: all .15s ease; position: relative;
  display: flex; flex-direction: column; gap: 5px;
}
.cal-cell:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.cal-cell.other { opacity: .4; }
.cal-cell.today { border: 2px solid var(--primary); }
.cal-cell .dnum { font-size: 13px; font-weight: 800; }
.cal-dots { display: flex; gap: 3px; flex-wrap: wrap; }
.cal-dot { width: 8px; height: 8px; border-radius: 50%; }
.cal-dot.health { background: var(--primary); }
.cal-dot.posture { background: var(--accent); }
.cal-dot.french { background: #38bdf8; }
.cal-dot.plan { background: var(--warn); }
.day-detail .dd-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
.day-detail .dd-row:last-child { border-bottom: none; }
.day-detail .dd-label { flex: 1; font-size: 13.5px; }
.makeup-note { font-size: 12px; color: var(--text-soft); margin-top: 8px; }

/* ---------- 设置/皮肤 ---------- */
.theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
@media (max-width: 720px){ .theme-grid { grid-template-columns: repeat(2,1fr); } }
.theme-card { border: 2px solid transparent; border-radius: 16px; padding: 14px; cursor: pointer; transition: all .18s ease; background: var(--card-solid); }
.theme-card.active { border-color: var(--primary); box-shadow: var(--shadow); }
.theme-swatch { height: 46px; border-radius: 12px; margin-bottom: 10px; }
.theme-name { font-size: 13.5px; font-weight: 700; text-align: center; }
.empty { text-align: center; color: var(--text-soft); padding: 30px; font-size: 14px; }
.sec-title { font-size: 15px; font-weight: 800; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--text-soft); font-size: 12.5px; }
.divider { height: 1px; background: var(--border); margin: 18px 0; }

/* ---------- 健身/习惯打卡新布局（参考结构，使用主题色） ---------- */
.hero-banner {
  background: var(--grad);
  border-radius: 24px;
  padding: 24px 28px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;

}
.hero-banner .hero-num {
  font-size: 56px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -2px;
}
.hero-banner .hero-label {
  font-size: 14px;
  opacity: .92;
  margin-top: 6px;
  font-weight: 600;
}
.hero-banner .hero-illust {
  font-size: 70px;
  opacity: .95;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,.12));
}

.cat-grid {

  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));

  margin-bottom: 18px;
}
.cat-grid .cat-btn {

.today-status {

.checkin-card .main { flex: 1; min-width: 0; }
.checkin-card .title {

}

.checkin-card .desc {

  margin-bottom: 9px;
}
.checkin-card .tags {

  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.tip-card {

<script>
/* ============================================================
   store.js · 本地数据层（localStorage）
   所有数据持久化在浏览器，无需服务器，离线可用。
   ============================================================ */
(function (global) {
  'use strict';

  const STORE_KEY = 'yueji_workbench_v1';
  const uid = () => Math.random().toString(36).slice(2, 9);

  function todayStr(d) {
    d = d || new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }
  function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return todayStr(d);
  }

  function defaultData() {
    return {
      user: { name: '小主' },
      habits: [
        { id: uid(), name: '拍八虚', icon: '🤲', videoUrl: '', note: '疏通经络，每天早晚各一次', done: {} },
        { id: uid(), name: '八段锦', icon: '🧘', videoUrl: '', note: '传统养生功法，全套约 12 分钟', done: {} },
        { id: uid(), name: '仙人揉腹', icon: '🌿', videoUrl: '', note: '顺时针揉腹，助消化安眠', done: {} },
      ],
      postureCats: [
        { id: uid(), name: '肩' },
        { id: uid(), name: '背' },
        { id: uid(), name: '臀' },
        { id: uid(), name: '腿' },
        { id: uid(), name: '全身' },
      ],
      postureExercises: [], // {id, catId, name, videoUrl, done:{}}
      recipes: [],          // {id, title, videoUrl, tags:[], ingredients:[], steps:[], tips}
      diary: [],            // {id, date, content, tags:[]}
      plans: [],            // {id, date, title, time, done}
      french: {
        level: 'A1',
        videos: [],         // 用户自添加的教学视频 {topic, url}
        records: {},        // date -> {skills, quiz, quizScore, videos, done}
      },
      viral: { date: '', items: [] },
      tea: { favorites: [], week: { start: '', plan: {} } }, // 茶饮管家：收藏id / 周计划
      settings: { theme: 'purple', name: '小主' },
    };
  }

  let DB = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaultData();
      const data = JSON.parse(raw);
      // 简单兜底，确保字段存在
      const def = defaultData();
      return Object.assign(def, data, {
        settings: Object.assign(def.settings, data.settings || {}),
        french: Object.assign(def.french, data.french || {}),
        tea: Object.assign(def.tea, data.tea || {}),
      });
    } catch (e) {
      return defaultData();
    }
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) {}
  }

  /* ---------- 通用打卡 ---------- */
  // coll: 'habits' | 'postureExercises' ；集合项含 done:{date:true}
  function toggleDone(coll, id, date) {
    date = date || todayStr();
    const item = DB[coll].find((x) => x.id === id);
    if (!item) return false;
    item.done = item.done || {};
    if (item.done[date]) delete item.done[date];
    else item.done[date] = true;
    save();
    return !!item.done[date];
  }
  function isDone(coll, id, date) {
    const item = DB[coll].find((x) => x.id === id);
    return !!(item && item.done && item.done[date]);
  }

  /* ---------- 养生习惯 ---------- */
  function addHabit(obj) {
    DB.habits.push(Object.assign({ id: uid(), icon: '🌿', videoUrl: '', note: '', done: {} }, obj));
    save();
  }
  function updateHabit(id, patch) {
    const h = DB.habits.find((x) => x.id === id);
    if (h) Object.assign(h, patch);
    save();
  }
  function removeHabit(id) {
    DB.habits = DB.habits.filter((x) => x.id !== id);
    save();
  }

  /* ---------- 体态锻炼 ---------- */
  function addPostureCat(name) {
    DB.postureCats.push({ id: uid(), name });
    save();
  }
  function removePostureCat(id) {
    DB.postureExercises = DB.postureExercises.filter((e) => e.catId !== id);
    DB.postureCats = DB.postureCats.filter((c) => c.id !== id);
    save();
  }
  function addPostureExercise(catId, obj) {
    DB.postureExercises.push(Object.assign({ id: uid(), catId, videoUrl: '', done: {} }, obj));
    save();
  }
  function updatePostureExercise(id, patch) {
    const e = DB.postureExercises.find((x) => x.id === id);
    if (e) Object.assign(e, patch);
    save();
  }
  function removePostureExercise(id) {
    DB.postureExercises = DB.postureExercises.filter((x) => x.id !== id);
    save();
  }
  function postureByCat(catId) {
    return DB.postureExercises.filter((e) => e.catId === catId);
  }

  /* ---------- 食谱 ---------- */
  function addRecipe(obj) {
    DB.recipes.push(Object.assign({ id: uid(), title: '未命名方子', videoUrl: '', tags: [], ingredients: [], steps: [], tips: '' }, obj));
    save();
    return DB.recipes[DB.recipes.length - 1];
  }
  function updateRecipe(id, patch) {
    const r = DB.recipes.find((x) => x.id === id);
    if (r) Object.assign(r, patch);
    save();
  }
  function removeRecipe(id) {
    DB.recipes = DB.recipes.filter((x) => x.id !== id);
    save();
  }

  /* ---------- 日记 ---------- */
  function upsertDiary(date, content) {
    let d = DB.diary.find((x) => x.date === date);
    if (d) d.content = content;
    else DB.diary.push({ id: uid(), date, content });
    save();
    return d || DB.diary[DB.diary.length - 1];
  }
  function getDiary(date) {
    return DB.diary.find((x) => x.date === date);
  }
  function removeDiary(id) {
    DB.diary = DB.diary.filter((x) => x.id !== id);
    save();
  }

  /* ---------- 计划（日历） ---------- */
  function addPlan(obj) {
    DB.plans.push(Object.assign({ id: uid(), date: todayStr(), title: '', time: '', done: false }, obj));
    save();
  }
  function updatePlan(id, patch) {
    const p = DB.plans.find((x) => x.id === id);
    if (p) Object.assign(p, patch);
    save();
  }
  function removePlan(id) {
    DB.plans = DB.plans.filter((x) => x.id !== id);
    save();
  }
  function plansOn(date) {
    return DB.plans.filter((p) => p.date === date);
  }

  /* ---------- 法语 ----------
     进度模型：听说读写四项技能，每项每天若干素材条目，
     完成度 = 已勾条目 / 当日条目数；frenchDone 由四项是否全满推导。 */
  function setFrenchLevel(level) { DB.french.level = level; save(); }
  function recordFrench(date, rec) {
    DB.french.records[date] = Object.assign(DB.french.records[date] || {}, rec);
    save();
  }
  function getFrench(date) { return DB.french.records[date]; }
  function ensureFrenchRec(date) {
    const r = DB.french.records[date] || (DB.french.records[date] = {});
    r.skills = r.skills || { listen: {}, speak: {}, read: {}, write: {} };
    return r;
  }
  // 勾选/取消某技能某条素材
  function setFrenchSkillItem(date, skill, id, done) {
    const r = ensureFrenchRec(date);
    r.skills[skill] = r.skills[skill] || {};
    r.skills[skill][id] = Object.assign(r.skills[skill][id] || {}, { done: done });
    save();
  }
  function getFrenchSkillItem(date, skill, id) {
    const r = DB.french.records[date];
    return (r && r.skills && r.skills[skill]) ? (r.skills[skill][id] || null) : null;
  }
  // 写作文本自动保存
  function setFrenchWriteText(date, id, text) {
    const r = ensureFrenchRec(date);
    r.skills.write = r.skills.write || {};
    r.skills.write[id] = Object.assign(r.skills.write[id] || {}, { text: text });
    save();
  }
  // 单项技能进度 {done,total,pct}
  function frenchSkillProgress(date, skill, total) {
    const r = DB.french.records[date];
    let done = 0;
    if (r && r.skills && r.skills[skill]) {
      Object.keys(r.skills[skill]).forEach((id) => { if (r.skills[skill][id].done) done++; });
    }
    return { done: done, total: total, pct: total ? Math.round((done / total) * 100) : 0 };
  }
  // 今日是否全部完成：手动 done 优先；否则看四项技能是否全满
  function frenchDone(date) {
    const r = DB.french.records[date];
    if (r && r.done) return true; // 手动覆盖（日历补卡）
    const F = global.French;
    if (F && F.SKILLS && F.skillTotals) {
      const lv = DB.french.level;
      const totals = F.skillTotals(date, lv);
      let any = false, all = true;
      F.SKILLS.forEach((sk) => {
        const total = totals[sk.key];
        let done = 0;
        if (r && r.skills && r.skills[sk.key]) {
          Object.keys(r.skills[sk.key]).forEach((id) => { if (r.skills[sk.key][id].done) done++; });
        }
        if (total > 0) { any = true; if (done < total) all = false; }
      });
      if (any) return all;
    }
    return false;
  }
  // 一键完成今日所有技能条目
  function completeFrenchToday(date) {
    const F = global.French;
    if (!F) return;
    const lv = DB.french.level;
    const totals = F.skillTotals(date, lv);
    F.SKILLS.forEach((sk) => {
      F.dailySkillItems(sk.key, date, lv, totals[sk.key]).forEach((it) => {
        setFrenchSkillItem(date, sk.key, it.id, true);
      });
    });
  }
  function toggleFrench(date) {
    const r = DB.french.records[date] || { done: false };
    r.done = !r.done;
    DB.french.records[date] = r;
    save();
    return r.done;
  }
  function setFrenchVideo(date, id, studied) {
    const r = DB.french.records[date] || {};
    r.videos = r.videos || [];
    let it = r.videos.find((x) => x.id === id);
    if (!it) { it = { id: id }; r.videos.push(it); }
    it.studied = studied;
    DB.french.records[date] = r;
    save();
  }

  /* ---------- 主题 ---------- */
  function setTheme(t) { DB.settings.theme = t; save(); applyTheme(); }
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', DB.settings.theme || 'purple');
  }

  /* ---------- 茶饮管家 ---------- */
  function isTeaFav(id) { return DB.tea.favorites.includes(id); }
  function toggleTeaFav(id) {
    const i = DB.tea.favorites.indexOf(id);
    if (i >= 0) DB.tea.favorites.splice(i, 1); else DB.tea.favorites.push(id);
    save();
    return isTeaFav(id);
  }
  function setTeaDay(date, teaId) {
    DB.tea.week.plan = DB.tea.week.plan || {};
    DB.tea.week.plan[date] = teaId;
    save();
  }
  function clearTeaDay(date) {
    if (DB.tea.week.plan) delete DB.tea.week.plan[date];
    save();
  }
  function getTeaPlan() { return DB.tea.week.plan || {}; }

  /* ---------- 今日聚合（概览/侧栏） ---------- */
  function todaySummary() {
    const t = todayStr();
    const healthDone = DB.habits.filter((h) => h.done && h.done[t]).length;
    const postureDone = DB.postureExercises.filter((e) => e.done && e.done[t]).length;
    const postureTotal = DB.postureExercises.length;
    const french = frenchDone(t);
    const total = healthDone + postureDone + (french ? 1 : 0);
    return { healthDone, healthTotal: DB.habits.length, postureDone, postureTotal, french, total };
  }

  /* ---------- 导出/导入（备份） ---------- */
  function exportData() { return JSON.stringify(DB, null, 2); }
  function importData(json) {
    try {
      const data = JSON.parse(json);
      DB = Object.assign(defaultData(), data);
      save();
      return true;
    } catch (e) { return false; }
  }

  global.Store = {
    get DB() { return DB; },
    save, uid, todayStr, addDays,
    toggleDone, isDone,
    addHabit, updateHabit, removeHabit,
    addPostureCat, removePostureCat, addPostureExercise, updatePostureExercise, removePostureExercise, postureByCat,
    addRecipe, updateRecipe, removeRecipe,
    upsertDiary, getDiary, removeDiary,
    addPlan, updatePlan, removePlan, plansOn,
    setFrenchLevel, recordFrench, getFrench, ensureFrenchRec, setFrenchSkillItem, getFrenchSkillItem, setFrenchWriteText, frenchSkillProgress, frenchDone, completeFrenchToday, toggleFrench, setFrenchVideo,
    setTheme, applyTheme,
    isTeaFav, toggleTeaFav, setTeaDay, clearTeaDay, getTeaPlan,
    todaySummary, exportData, importData,
  };
})(window);

</script>
<script>
/* ============================================================
   viral.js · 爆款灵感内容引擎
   每日自动生成 10 条抖音/小红书爆款/带货脚本，可按 6 段架构拆解。
   说明：本引擎内置精选脚本模板库，离线即可生成与刷新；若接入 AI
   接口可替换为实时抓取+生成。当前为"最佳努力"离线版。
   ============================================================ */
(function (global) {
  'use strict';

  // 模板结构：platform / category / title / hook / fullText /
  // timeline(逐秒标注) / visuals(画面) / audio(音频) / logic(爆火逻辑) / template(可仿写脚本)
  const POOL = [
    /* ---------------- 养生类 ---------------- */
    {
      platform: '小红书', category: '养生',
      title: '拍八虚 21 天，我的淤堵脸终于通透了',
      hook: '你每天累得像被抽干，可能不是缺觉，是「堵」了。',
      fullText: '以前我以为疲劳就是没睡够，后来才知道气血淤堵才是元凶。坚持拍八虚 21 天：肘窝、腋窝、腹股沟、腘窝，每个 30 下。第一周只想放弃，第二周睡觉变沉，第三周素颜都被夸气色好。养生不是玄学，是每天 5 分钟对自己好一点。',
      timeline: [

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 生成 10 条：保证三类均衡（每类尽量 3-4 条）
  function generate(force) {
    const today = Store.todayStr();
    if (!force && Store.DB.viral.date === today && Store.DB.viral.items.length) {
      return Store.DB.viral.items;
    }
    const cats = ['养生', '穿搭带货', '审美提升'];
    const byCat = {};
    cats.forEach((c) => (byCat[c] = shuffle(POOL.filter((p) => p.category === c))));
    const picked = [];
    // 轮流取，保证均衡
    let round = 0;
    while (picked.length < 10) {
      const c = cats[round % cats.length];
      const item = byCat[c].shift();
      if (item) picked.push(item);
      else {
        // 该类用完，从剩余补
        const rest = shuffle(POOL).find((p) => !picked.includes(p));
        if (rest) picked.push(rest); else break;
      }
      round++;
    }
    Store.DB.viral = { date: today, items: picked };
    Store.save();
    return picked;
  }

  global.Viral = { generate, POOL };

  const SKILL_CONTENT = {};

    SKILL_CONTENT[s.key] = {};
    Object.keys(SKILL_RAW[s.key]).forEach((lv) => {
      SKILL_CONTENT[s.key][lv] = SKILL_RAW[s.key][lv].map((it, i) => Object.assign({ id: s.key + '-' + lv + '-' + i }, it));
    });
  });

  function skillPool(skill, level) {
    const bank = SKILL_CONTENT[skill] || {};
    return bank[level] || bank.B2 || [];
  }

  // 按日期确定性轮排：每个技能独立的偏移种子，保证四模块内容不同步
  function dailySkillItems(skill, dateStr, level, n) {
    const pool = skillPool(skill, level);
    if (!pool.length) return [];
    const ep = Math.floor(Date.parse(dateStr + 'T00:00:00') / 86400000);
    const seed = { listen: 1, speak: 2, read: 3, write: 4 }[skill] || 0;
    const start = (((ep + seed) % pool.length) + pool.length) % pool.length;
    const out = [];
    for (let i = 0; i < n; i++) out.push(pool[(start + i) % pool.length]);
    return out;
  }

    const o = {};

    return o;
  }

    if (/臀|hip|butt|股/.test(n)) return '🍑';
    if (/腿|leg/.test(n)) return '🦵';
    if (/腰|waist|腹|abs|核心/.test(n)) return '🧘‍♀️';
    if (/全身|whole|full|燃脂|有氧/.test(n)) return '🏃‍♀️';

  // 基于关键词的日记归纳（离线规则版）
  function diaryAnalysis() {
    const all = S.DB.diary;
    if (!all.length) return `<div class="analysis"><p class="muted">写几篇日记后，这里会自动归纳你的情绪、卡点，并建议可建立的 skill。</p></div>`;
    const pos = ['开心', '高兴', '喜欢', '舒服', '轻松', '满足', '幸福', '进步', '坚持', '治愈', '平静'];
    const neg = ['累', '焦虑', '烦', '难过', '压力', '失眠', '委屈', '崩溃', '低落', '疲惫'];
    const stuckWords = ['卡', '卡点', '不会', '难', '烦恼', '坚持不下去', '做不到', '瓶颈', '拖延', '放弃', '犹豫'];
    const skillMap = {
      '睡眠': '睡眠优化 skill（睡前揉腹+泡脚方）',
      '法语': '法语听说读陪练 skill',
      '体态': '体态跟练打卡 skill',
      '饮食': '养生食谱管理 skill',
      '情绪': '情绪日记复盘 skill',
      '护肤': '成分护肤 skill',
      '穿搭': '胶囊衣橱 skill',
    };
    let posC = 0, negC = 0;
    const stuck = [];
    const skillHits = new Set();
    const recent = all.slice(-7);
    recent.forEach((d) => {
      const c = d.content || '';
      pos.forEach((w) => { if (c.includes(w)) posC++; });
      neg.forEach((w) => { if (c.includes(w)) negC++; });
      stuckWords.forEach((w) => {
        if (c.includes(w)) {
          const seg = c.split(/[。！？\n]/).find((s) => s.includes(w));
          if (seg && stuck.length < 6) stuck.push(seg.trim());
        }
      });
      Object.keys(skillMap).forEach((k) => { if (c.includes(k)) skillHits.add(skillMap[k]); });
    });
    const mood = posC > negC ? '整体偏积极 🌤' : negC > posC ? '整体偏疲惫/焦虑 🌧' : '情绪较平稳 ⛅';
    const total = all.length;
    return `<div class="analysis">
      <div class="kpi-row">
        <div class="kpi"><div class="n">${total}</div><div class="l">累计日记</div></div>
        <div class="kpi"><div class="n">${posC}</div><div class="l">积极信号</div></div>
        <div class="kpi"><div class="n">${negC}</div><div class="l">压力信号</div></div>
      </div>
      <h4>📊 情绪概览</h4><p class="line" style="font-size:13.5px;line-height:1.7">近 7 篇：${mood}。${posC && negC ? '有起伏是常态，关注消耗你的事。' : ''}</p>
      <h4 style="margin-top:14px">🚧 可能的卡点</h4>
      ${stuck.length ? `<ul>${stuck.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : '<p class="muted">暂未识别明显卡点。</p>'}
      <h4 style="margin-top:14px">🛠 建议建立的 skill</h4>
      ${skillHits.size ? `<ul>${Array.from(skillHits).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : '<p class="muted">继续记录，系统会按你的高频话题给出建议。</p>'}
      <p class="muted" style="margin-top:10px">* 当前为离线关键词归纳，接入 AI 后可做更深度的语义分析。</p>
    </div>`;
  }

  // 浏览器 TTS：用法语朗读素材（听/说模块的点读）
  function speakFr(text) {
    try {
      if (!('speechSynthesis' in window)) { toast('当前环境不支持朗读'); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      u.rate = 0.85;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function renderFrench() {
    const lvl = French.getLevel(S.DB.french.level);
    const topics = French.lessonTopics(lvl.key);
    const frVideos = S.DB.french.videos || [];
    const lessons = topics.map((t, i) => {
      const v = frVideos.find((x) => x.topic === t);
      return `<div class="fr-lesson">
        <span class="lv">${lvl.key}</span>
        <div class="habit-main" style="flex:1"><div class="habit-name">${i + 1}. ${esc(t)}</div></div>
        ${v ? jumpBtn(v.url) : ''}
        <button class="btn ghost sm" data-action="fr-add-video" data-topic="${esc(t)}">＋ 视频</button>
      </div>`;
    }).join('');
    // 兼容旧数据：保证 quiz 已生成并持久化
    let rec = S.getFrench(ui.frenchDate) || {};
    if (!rec.quiz) rec.quiz = French.genQuiz(S.DB.french.level, 4);
    S.recordFrench(ui.frenchDate, rec);

    // 总进度（听说读写四项之和）
    const totals = French.skillTotals(ui.frenchDate, S.DB.french.level);
    let totDone = 0, totAll = 0;
    French.SKILLS.forEach((sk) => {
      const p = S.frenchSkillProgress(ui.frenchDate, sk.key, totals[sk.key]);
      totDone += p.done; totAll += totals[sk.key];
    });
    const overallPct = totAll ? Math.round((totDone / totAll) * 100) : 0;
    const allDone = overallPct === 100;

    // 渲染单个技能卡片（含具体素材 + 进度条 + 一键跟学视频）
    const renderSkill = (skill) => {
      const total = totals[skill.key];
      const items = French.dailySkillItems(skill.key, ui.frenchDate, S.DB.french.level, total);
      const prog = S.frenchSkillProgress(ui.frenchDate, skill.key, total);
      const pct = prog.pct;
      const videoKw = French.skillVideoKw(skill.key, ui.frenchDate);
      const videoUrls = French.skillVideoUrls(skill.key, ui.frenchDate);
      const itemsHTML = items.map((it) => {
        const st = S.getFrenchSkillItem(ui.frenchDate, skill.key, it.id);
        const done = !!(st && st.done);
        if (skill.kind === 'write') {
          const text = (st && st.text) || '';

              <div class="fr-item-q">✍️ ${esc(it.prompt)}</div>

    const quizList = rec.quiz;
    const quizHTML = quizList.map((q, qi) => `

      </div>

      <div class="card fr-overall ${allDone ? 'done' : ''}">
        <div class="fr-overall-top"><span>📊 今日总进度</span><span class="fr-overall-pct">${totDone}/${totAll} 项 · ${overallPct}%</span></div>
        <div class="fr-progress big ${overallPct === 100 ? 'done' : ''}"><i style="width:${overallPct}%"></i></div>
        <p class="muted" style="margin:8px 0 0">每学完一条素材就勾一下，进度像看视频一样实时累加；四项全绿即今日完成。</p>

  /* ============================================================
     日历
     ============================================================ */
  function renderCalendar() {
    const d = ui.calMonth;
    const y = d.getFullYear(), m = d.getMonth();
    const first = new Date(y, m, 1);
    const startDow = (first.getDay() + 6) % 7; // 周一为始
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const cells = [];
    for (let i = 0; i < startDow; i++) {
      const dd = prevDays - startDow + 1 + i;
      const ds = fmt(y, m - 1, dd);
      cells.push(cell(ds, dd, true));
    }
    for (let dd = 1; dd <= daysInMonth; dd++) cells.push(cell(fmt(y, m, dd), dd, false));
    const total = startDow + daysInMonth;
    const tail = (7 - (total % 7)) % 7;
    for (let i = 1; i <= tail; i++) cells.push(cell(fmt(y, m + 1, i), i, true));

    const html = `
      <div class="view-head">
        <div><div class="view-title">日历</div><div class="view-desc">计划 · 自动标记打卡 · 补卡</div></div>
        <button class="btn" data-action="add-plan">＋ 添加计划</button>
      </div>
      <div class="card">
        <div class="cal-head">
          <button class="icon-btn" data-action="cal-prev">‹</button>
          <div style="font-weight:800;font-size:17px">${y} 年 ${m + 1} 月</div>
          <button class="icon-btn" data-action="cal-next">›</button>
        </div>
        <div class="cal-grid">
          ${['一', '二', '三', '四', '五', '六', '日'].map((w) => `<div class="cal-dow">${w}</div>`).join('')}
          ${cells.join('')}
        </div>
        <div class="makeup-note">图例：<span class="cal-dot health"></span>养生 <span class="cal-dot posture"></span>体态 <span class="cal-dot french"></span>法语 <span class="cal-dot plan"></span>计划。点击任意日期可补卡 / 加计划。</div>
      </div>`;
    mount(html);
  }
  function fmt(y, m, d) {
    const dt = new Date(y, m, d);
    const yy = dt.getFullYear();
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    return `${yy}-${mm}-${dd}`;
  }
  function cell(ds, dd, other) {
    const t = ds;
    const hd = S.DB.habits.filter((h) => h.done && h.done[t]).length;
    const pd = S.DB.postureExercises.filter((e) => e.done && e.done[t]).length;
    const fd = S.frenchDone(t);
    const plans = S.plansOn(t);
    const dots = [];
    if (hd) dots.push('<span class="cal-dot health"></span>');
    if (pd) dots.push('<span class="cal-dot posture"></span>');
    if (fd) dots.push('<span class="cal-dot french"></span>');
    if (plans.length) dots.push('<span class="cal-dot plan"></span>');
    const isToday = ds === S.todayStr();
    return `<div class="cal-cell ${other ? 'other' : ''} ${isToday ? 'today' : ''}" data-action="cal-day" data-date="${ds}">
      <div class="dnum">${dd}</div>
      <div class="cal-dots">${dots.join('')}</div>
      ${plans.length ? `<div class="muted" style="font-size:11px">${esc(plans[0].title)}${plans.length > 1 ? ' +' + (plans.length - 1) : ''}</div>` : ''}
    </div>`;
  }

  // 日期详情（补卡 + 计划）
  function dayDetail(ds) {
    const t = ds;
    const habits = S.DB.habits.map((h) => {
      const done = !!(h.done && h.done[t]);
      return `<div class="dd-row"><div class="dd-label">🌿 ${esc(h.name)}</div>
        <div class="check ${done ? 'on' : ''}" data-action="mk-habit" data-id="${h.id}" data-date="${t}">${done ? '✓' : ''}</div></div>`;
    }).join('');
    const ex = S.DB.postureExercises.map((e) => {
      const done = !!(e.done && e.done[t]);
      return `<div class="dd-row"><div class="dd-label">💪 ${esc(e.name)}</div>
        <div class="check ${done ? 'on' : ''}" data-action="mk-ex" data-id="${e.id}" data-date="${t}">${done ? '✓' : ''}</div></div>`;
    }).join('');
    const fd = S.frenchDone(t);
    const plans = S.plansOn(t).map((p) => `<div class="dd-row">

  /* ============================================================
     事件委托
     ============================================================ */
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('.nav-item');
    if (nav) { e.preventDefault(); switchView(nav.dataset.view); return; }
    const ql = e.target.closest('.quick-link');
    if (ql) { switchView(ql.dataset.view); return; }
    // 跳转链接不拦截
    const t = e.target.closest('[data-action]');
    if (!t) return;
    const a = t.dataset.action;
    const id = t.dataset.id;
    switch (a) {
      // 养生
      case 'toggle-habit': { const on = S.toggleDone('habits', id); toast(on ? '已打卡 ✓' : '已取消'); refreshTop(); renderHealth(); break; }
      case 'add-habit': addHabitModal(); break;
      case 'edit-habit': editHabitModal(id); break;
      case 'del-habit': { if (confirm('删除该习惯？')) { S.removeHabit(id); renderHealth(); } break; }
      // 体态
      case 'posture-cat': ui.postureCat = id; renderPosture(); break;
      case 'add-cat': addCatModal(); break;
      case 'del-cat': { if (confirm('删除该分类及下属动作？')) { S.removePostureCat(id); if (ui.postureCat === id) ui.postureCat = null; renderPosture(); } break; }
      case 'add-ex': addExModal(); break;
      case 'edit-ex': editExModal(id); break;
      case 'del-ex': { if (confirm('删除该动作？')) { S.removePostureExercise(id); renderPosture(); } break; }
      case 'toggle-ex': { const on = S.toggleDone('postureExercises', id); toast(on ? '已打卡 ✓' : '已取消'); refreshTop(); renderPosture(); break; }
      // 食谱
      case 'add-recipe': recipeModal(null); break;
      case 'add-recipe-link': recipeLinkModal(); break;
      case 'edit-recipe': recipeModal(id); break;
      case 'del-recipe': { if (confirm('删除该方子？')) { S.removeRecipe(id); renderRecipe(); } break; }
      // 日记
      case 'edit-diary': diaryModal(t.dataset.date); break;
      case 'del-diary': { if (confirm('删除该日记？')) { S.removeDiary(id); renderDiary(); } break; }
      case 'toggle-plan': { const p = S.DB.plans.find((x) => x.id === id); if (p) { S.updatePlan(id, { done: !p.done }); } refreshTop(); renderOverview(); break; }
      // 爆款
      case 'viral-refresh': { ui.viralItems = Viral.generate(true); toast('已换一批灵感'); renderViral(); break; }
      case 'viral-detail': viralDetail(parseInt(t.dataset.i, 10)); break;
      // 茶饮管家
      case 'tea-search': doTeaSearch(); break;
      case 'tea-clear-search': ui.teaQuery = ''; renderTea(); break;
      case 'tea-quick': { $('#teaSearch').value = t.dataset.q; ui.teaQuery = t.dataset.q; renderTea(); break; }
      case 'tea-fav': { const on = S.toggleTeaFav(id); toast(on ? '已收藏 ★' : '已取消收藏'); renderTea(); break; }
      case 'tea-prev-week': ui.teaWeekStart = Tea.addDaysStr(ui.teaWeekStart, -7); renderTea(); break;
      case 'tea-next-week': ui.teaWeekStart = Tea.addDaysStr(ui.teaWeekStart, 7); renderTea(); break;
      case 'tea-autofill': teaAutofill(); renderTea(); break;
      case 'tea-day': teaPickModal(t.dataset.date); break;
      case 'tea-assign': { S.setTeaDay(t.dataset.date, t.dataset.id); closeModal(); renderTea(); toast('已安排'); break; }
      case 'tea-clear-day': { S.clearTeaDay(t.dataset.date); closeModal(); renderTea(); break; }
      // 法语
      case 'fr-level': S.setFrenchLevel(t.dataset.key); ui.frenchDate = S.todayStr(); renderFrench(); toast('已切到 ' + t.dataset.key); break;
      case 'fr-skill-item': {
        const sk = t.dataset.skill, id = t.dataset.id;
        const cur = S.getFrenchSkillItem(ui.frenchDate, sk, id);
        S.setFrenchSkillItem(ui.frenchDate, sk, id, !(cur && cur.done));
        refreshTop(); renderFrench(); break;
      }
      case 'fr-complete': { S.completeFrenchToday(ui.frenchDate); toast('今日全部完成 🎉'); refreshTop(); renderFrench(); break; }
      case 'fr-tts': speakFr(t.dataset.text); break;
      case 'fr-newquiz': { const r = S.getFrench(ui.frenchDate) || {}; r.quiz = French.genQuiz(S.DB.french.level, 4); S.recordFrench(ui.frenchDate, r); renderFrench(); break; }
      case 'fr-quiz': frQuizAnswer(t.dataset.q, t.dataset.o); break;
      case 'fr-add-video': frAddVideoModal(t.dataset.topic); break;
      // 日历
      case 'cal-prev': ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() - 1, 1); renderCalendar(); break;
      case 'cal-next': ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() + 1, 1); renderCalendar(); break;
      case 'cal-day': dayDetail(t.dataset.date); break;
      case 'mk-habit': { S.toggleDone('habits', id, t.dataset.date); dayDetail(t.dataset.date); refreshTop(); break; }
      case 'mk-ex': { S.toggleDone('postureExercises', id, t.dataset.date); dayDetail(t.dataset.date); refreshTop(); break; }
      case 'mk-french': { S.toggleFrench(t.dataset.date); dayDetail(t.dataset.date); refreshTop(); break; }
      case 'mk-plan': { S.updatePlan(id, { done: !S.DB.plans.find((p) => p.id === id).done }); dayDetail(t.dataset.date); break; }
      case 'del-plan': { S.removePlan(id); dayDetail(t.dataset.date); break; }
      case 'add-plan': planModal(S.todayStr()); break;
      case 'add-plan-date': planModal(t.dataset.date); break;
      // 设置
      case 'set-theme': S.setTheme(t.dataset.k); renderSettings(); toast('已切换皮肤'); break;
      case 'theme-quick': {
        const order = ['purple', 'green', 'yellow', 'blue', 'pink'];
        const cur = S.DB.settings.theme || 'purple';
        const next = order[(order.indexOf(cur) + 1) % order.length];
        S.setTheme(next); toast('皮肤：' + ({ purple: '紫韵', green: '抹茶绿', yellow: '暖阳黄', blue: '黛蓝', pink: '樱粉' }[next]));
        break;
      }
      case 'save-name': { S.DB.settings.name = $('#setName').value; S.save(); toast('已保存'); break; }
      case 'export-data': exportData(); break;
      case 'import-data': importModal(); break;
      case 'reset-data': { if (confirm('确定清空所有数据？此操作不可恢复！')) { localStorage.removeItem('yueji_workbench_v1'); location.reload(); } break; }
      // 首次引导：把单文件变成手机/桌面 App
      case 'apphint-ok': { try { localStorage.setItem('gw_apphint_v1', '1'); } catch (e) {} closeModal(); break; }
    }
  });

  // 茶饮搜索：回车即搜

  document.addEventListener('input', (e) => {

    S.setFrenchWriteText(ui.frenchDate, ta.dataset.id, ta.value);

  // 弹层内事件（保存按钮等）
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-modal-action]');
    if (!b) return;
    const a = b.dataset.modalAction;
    if (a === 'close') closeModal();
    if (a === 'save-habit') {
      const id = b.dataset.id; const obj = readHabitForm();
      if (id) S.updateHabit(id, obj); else S.addHabit(obj); closeModal(); renderHealth(); toast('已保存');
    }
    if (a === 'save-cat') { const n = $('#catName').value.trim(); if (n) { S.addPostureCat(n); closeModal(); renderPosture(); } }
    if (a === 'save-ex') {
      const id = b.dataset.id; const obj = readExForm();
      if (id) S.updatePostureExercise(id, obj); else S.addPostureExercise(ui.postureCat, obj); closeModal(); renderPosture(); toast('已保存');
    }
    if (a === 'save-recipe') { const id = b.dataset.id; const obj = readRecipeForm(); if (id) S.updateRecipe(id, obj); else S.addRecipe(obj); closeModal(); renderRecipe(); toast('已保存'); }
    if (a === 'save-recipe-link') {
      const title = ($('#rTitle') && $('#rTitle').value.trim()) || '未命名方子';
      const videoUrl = ($('#rVideo') && $('#rVideo').value.trim()) || '';
      S.addRecipe({ title, videoUrl });
      closeModal(); renderRecipe(); toast('已建骨架方子，点“编辑”补全用料与步骤');
    }
    if (a === 'save-diary') { const d = $('#diaryDate').value; S.upsertDiary(d, $('#diaryText').value); closeModal(); renderDiary(); toast('已保存'); }
    if (a === 'save-plan') { const id = b.dataset.id; const obj = readPlanForm(); if (id) S.updatePlan(id, obj); else S.addPlan(obj); closeModal(); renderCalendar(); refreshTop(); toast('已添加'); }
    if (a === 'save-fr-video') { const topic = b.dataset.topic; const url = $('#frVideoUrl').value.trim(); frVideosPush(topic, url); closeModal(); renderFrench(); toast('已添加教学视频'); }
    if (a === 'do-import') doImport();
  });

  function readHabitForm() {
    return { name: $('#hName').value.trim() || '新习惯', icon: $('#hIcon').value.trim() || '🌿', note: $('#hNote').value.trim(), videoUrl: $('#hVideo').value.trim() };
  }
  function readExForm() {
    return { name: $('#exName').value.trim() || '新动作', videoUrl: $('#exVideo').value.trim() };
  }
  function readRecipeForm() {
    const ing = $('#rIng').value.split('\n').map((s) => s.trim()).filter(Boolean);

    const tags = $('#rTags').value.split(/[,，\s]+/).map((s) => s.trim()).filter(Boolean);
    return { title: $('#rTitle').value.trim() || '未命名方子', videoUrl: $('#rVideo').value.trim(), tags, ingredients: ing, steps: stp, tips: $('#rTips').value.trim() };
  }
  function readPlanForm() {
    return { date: $('#pDate').value, title: $('#pTitle').value.trim() || '计划', time: $('#pTime').value.trim() };
  }

  function frVideosPush(topic, url) {

  function frQuizAnswer(qi, oi) {
    const quiz = S.getFrench(ui.frenchDate).quiz;
    const q = quiz[parseInt(qi, 10)];
    const opts = $$('.quiz-opt', $('#modalBody'));
    // 找到该 quiz 块内选项
    const blocks = $$('.quiz', $('#modalBody'));
    const block = blocks[parseInt(qi, 10)];
    const bOpts = $$('.quiz-opt', block);
    bOpts.forEach((b) => (b.disabled = true));
    const correct = q.a === parseInt(oi, 10);
    bOpts[parseInt(oi, 10)].classList.add(correct ? 'correct' : 'wrong');
    if (!correct) bOpts[q.a].classList.add('correct');
    const fb = $('.quiz-fb', block);
    fb.textContent = (correct ? '✓ 答对！' : '✗ 答错。') + ' ' + q.e;
    // 记录正确数
    const r = S.getFrench(ui.frenchDate); r.quizScore = r.quizScore || {}; r.quizScore[qi] = correct; S.recordFrench(ui.frenchDate, r);
  }

  function exportData() {
    const blob = new Blob([S.exportData()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '嘎的工作台备份_' + S.todayStr() + '.json';
    a.click();
    toast('已导出备份');
  }
  function importModal() {
    openModal('导入备份', `<p class="muted" style="margin-bottom:10px">粘贴此前导出的 JSON 内容，将覆盖当前数据。</p>
      <textarea class="textarea" id="importText" style="min-height:160px"></textarea>
      <button class="btn" data-modal-action="do-import">导入并覆盖</button><button class="btn ghost" data-modal-action="close">取消</button>`);
  }
  function doImport() {
    const ok = S.importData($('#importText').value);
    if (ok) { closeModal(); toast('导入成功'); switchView('overview'); } else toast('JSON 格式错误');
  }

  /* ---------------- 弹层关闭 ---------------- */
  $('#modalClose').addEventListener('click', closeModal);
  $('#modalMask').addEventListener('click', (e) => { if (e.target.id === 'modalMask') closeModal(); });

  /* ---------------- 首次引导：把单文件变成 App ---------------- */
  function maybeShowAppHint() {
    try { if (localStorage.getItem('gw_apphint_v1') === '1') return; } catch (e) {}
    const html = `
      <div class="apphint">
        <p>把它变成手机 / 电脑上「直接点开」的 App：</p>
        <ul class="ah-list">
          <li><b>安卓手机</b>：用浏览器打开本文件 → 右上角 ⋮ → <b>添加到主屏幕</b>（断网也能开）</li>
          <li><b>iPhone</b>：在电脑该文件夹运行 <code>python3 -m http.server 8000</code>，手机连同一 WiFi，Safari 打开 <code>http://电脑内网IP:8000/本文件</code> → 分享 → <b>添加到主屏幕</b></li>
          <li><b>电脑</b>：双击打开 → 浏览器地址栏右侧 <b>📥 安装</b>，即成独立窗口 App</li>
        </ul>
        <p class="muted">说明：IDE 预览链接是内部代理，手机默认浏览器连不进来；用这个文件最稳，且可离线。</p>
        <div class="row-end"><button class="btn primary" data-action="apphint-ok">知道了，开始用</button></div>
      </div>`;
    openModal('📲 把它变成你的 App', html);
  }

  /* ---------------- 启动 ---------------- */
  S.applyTheme();
  refreshTop();
  switchView('overview');
  maybeShowAppHint();
  // 每天 9:00 自动推送更新爆款（若页面常开，跨过 9 点会自动刷新并提示）
  autoRefreshViral();
  setInterval(autoRefreshViral, 60 * 1000);
})();

</script>
</body>
</html>
